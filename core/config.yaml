# core settings. Every key is required; see ./README.md (## Config: every key in config.yaml).

schema_version: ATIF-v1.7

max_body_bytes: 5242880        # 5 MiB
max_transcript_bytes: 262144   # 256 KiB
rate_limit_per_minute: 120
default_survey_every: 2

redaction:
  enabled: true
  provider: presidio           # presidio | azure
  # Azure uses this whole list; presidio only covers en, es, fr, pt, ru.
  languages: [en, zh-hans, hi, es, fr, ar, bn, pt, ru, ur]
  azure_endpoint: "https://ratexp-lang.cognitiveservices.azure.com/"

# Secrets live in the env vars named below, never in this file.
write_adapters:
  app_be_psql:
    enabled: true
  custom_psql:
    enabled: false
    dsn_env: CUSTOM_PSQL_DSN
  app_be_dynatrace:
    enabled: true
    tenant_url_env: DT_TENANT_URL
    token_env: DT_ACCESS_TOKEN
  custom_dynatrace:
    enabled: false
    tenant_url_env: CUSTOM_DT_TENANT_URL
    token_env: CUSTOM_DT_TOKEN
  bluebox:
    enabled: false
    endpoint_env: BLUEBOX_OTLP_ENDPOINT
    token_env: BLUEBOX_OTLP_TOKEN

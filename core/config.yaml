# core settings. Every key is required; see ./README.md (## Config: every key in config.yaml).

schema_version: ATIF-v1.7

max_body_bytes: 5242880        # 5 MiB
max_transcript_bytes: 262144   # 256 KiB
rate_limit_per_minute: 120
default_survey_every: 5
default_survey_eval: human-satisfaction   # one of evals/<name>.yaml

redaction:
  enabled: true
  provider: presidio           # presidio | azure
  # Azure uses this whole list; presidio only covers en, es, fr, pt, ru.
  languages: [en, zh-hans, hi, es, fr, ar, bn, pt, ru, ur]
  azure_endpoint: "https://ratexp-lang.cognitiveservices.azure.com/"

labeling:
  enabled: true
  endpoint_env: AZURE_OPENAI_ENDPOINT   # unset = labeling skipped
  deployment: gpt-5-nano               # infra/ deploys it as labeling_model
  api_version: "2024-10-21"
  timeout_seconds: 8
  max_input_chars: 20000               # about 5,000 tokens
  # The label groups: for each rating, and again for each shared conversation, the model
  # picks one value per group, or none when it cannot tell. ./README.md (labeling.groups)
  # gives the rules: names, `means`, `values` or `when_good` + `when_bad`, the limits.
  groups:
    business_case:
      means: The technical area of the work.
      values: [DevOps, MLOps, ML, Imaging, Data, Frontend, Backend, Mobile, Security, Scripting, Writing, Other]
    language:
      means: The main programming language written or edited; No code when no code was involved.
      values: [Go, Python, TypeScript, JavaScript, Java, "C#", C++, Rust, Bash, SQL, Terraform, No code, Other]
    task_type:
      means: The kind of work, as the conventional commit types name it (feat, fix, docs, ...).
      values: [New feature, Bug fix, Docs, Style, Refactor, Tests, Chore, Other]
    feedback_theme:
      means: What the user praises (good rating) or complains about (bad rating).
      when_good:
        Process is easy: The steps were few and easy to follow.
        Completion is quick: It finished quickly.
        Result is correct: The result worked and was right.
        Result is complete: It did the whole task.
        Instructions are followed: It kept to what I asked and my rules.
        Changes are in scope: It changed only what I asked for.
        Answers are clear: Its answers were short and easy to follow.
        Agent is independent: It needed few questions or corrections.
        Actions are safe: It took no risky or destructive step.
        Tools are working: Install, tools and commands worked.
        Other praise: Praise that fits no other value.
      when_bad:
        Process is complex: Too many steps, or hard to follow.
        Completion is slow: It took too long or kept me waiting.
        Result is wrong: The result had bugs or was wrong.
        Result is incomplete: It left parts of the task undone.
        Instructions are ignored: It ignored or broke what I asked.
        Changes are out of scope: It changed or added things I never asked for.
        Answers are unclear: Its answers were confusing, vague or too long.
        Agent needs hand-holding: It asked too much or needed constant fixing.
        Actions are risky: It deleted, overwrote or ran something risky.
        Tools are broken: Install, tools or commands failed.
        Other complaint: A complaint that fits no other value.

# How many of the newest ratings, and the conversations from the same time span, each write
# destination below with `retention: true` keeps; ./README.md (retention) says how and when.
retention:
  keep_newest: 1000              # ratings; everything older is deleted

# Secrets live in the env vars named below, never in this file.
write_adapters:
  app_be_psql:
    enabled: true
    retention: true
  custom_psql:
    enabled: false
    retention: false
    dsn_env: CUSTOM_PSQL_DSN
  app_be_dynatrace:
    enabled: true
    tenant_url_env: DT_TENANT_URL
    token_env: DT_ACCESS_TOKEN
  custom_dynatrace:
    enabled: false
    tenant_url_env: CUSTOM_DT_TENANT_URL
    token_env: CUSTOM_DT_TOKEN
  bluebox:
    enabled: true
    endpoint_env: BLUEBOX_OTLP_ENDPOINT
    token_env: BLUEBOX_OTLP_TOKEN
  phoenix:
    enabled: true
    retention: true
    endpoint_env: PHOENIX_COLLECTOR_ENDPOINT
    api_key_env: PHOENIX_API_KEY
    project_env: PHOENIX_PROJECT_NAME

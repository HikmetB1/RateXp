# The app's Dashboard view: SQL over the feedback and transcript tables core writes
# (modules/write/schema/). The app image copies this file and dashboard_base.yaml out of
# core (see CONTRIBUTING.md).
#
# The app runs each sql with four named parameters - skill, agent, eval and since (an ISO
# timestamp) - and NULL means all. {filters} in a panel's sql is where filters.sql goes,
# so the FROM of every panel exposes created_at, skill_name, agent and eval_name; a
# transcript panel takes eval_name from a join with feedback, as transcript has none.
# filters.values fill the dropdowns; download.sql is the "Download trajectories" button,
# with limit as a fifth parameter. A null skill or eval is shown and matched as "(none)",
# as on Dynatrace, so whole-session ratings and ratings without an eval can be picked.
name: RateXp
filters:
  sql: >-
    (%(skill)s::text IS NULL OR COALESCE(skill_name, '(none)') = %(skill)s)
    AND (%(agent)s::text IS NULL OR split_part(agent, ' ', 1) = %(agent)s)
    AND (%(eval)s::text IS NULL OR COALESCE(eval_name, '(none)') = %(eval)s)
    AND (%(since)s::timestamptz IS NULL OR created_at >= %(since)s)
  values:
    skill: SELECT DISTINCT COALESCE(skill_name, '(none)') AS skill FROM feedback ORDER BY skill
    agent: SELECT DISTINCT split_part(agent, ' ', 1) AS agent FROM feedback ORDER BY agent
    eval: SELECT DISTINCT COALESCE(eval_name, '(none)') AS eval FROM feedback ORDER BY eval
download:
  sql: >-
    SELECT created_at, session_id, skill_name, agent, eval_name, score, comment, request_id
    FROM feedback WHERE {filters}
    ORDER BY created_at DESC LIMIT %(limit)s
panels:
  total_ratings:
    title: Total ratings
    kind: number
    sql: SELECT count(*) AS value FROM feedback WHERE {filters}
  percent_good:
    title: Percent good
    kind: number
    sql: >-
      SELECT round(100.0 * count(*) FILTER (WHERE score = 1) / NULLIF(count(*), 0), 1) AS value
      FROM feedback WHERE {filters} AND score IS NOT NULL
  ratings_24h:
    title: Ratings in the last 24h
    kind: number
    sql: >-
      SELECT count(*) AS value FROM feedback
      WHERE {filters} AND created_at >= now() - interval '24 hours'
  skills_rated:
    title: Skills rated
    kind: number
    sql: SELECT count(DISTINCT skill_name) AS value FROM feedback WHERE {filters}
  good_bad_over_time:
    sql: >-
      SELECT date_trunc('day', created_at) AS day,
      count(*) FILTER (WHERE score = 1) AS good,
      count(*) FILTER (WHERE score = 2) AS bad
      FROM feedback WHERE {filters}
      GROUP BY day ORDER BY day
  percent_good_by_skill:
    title: Percent good by skill (worst first)
    kind: bar
    sql: >-
      SELECT skill_name AS name, count(*) AS total,
      count(*) FILTER (WHERE score = 1) AS good,
      count(*) FILTER (WHERE score = 2) AS bad,
      round(100.0 * count(*) FILTER (WHERE score = 1) / count(*), 1) AS percent_good
      FROM feedback WHERE {filters} AND score IS NOT NULL AND skill_name IS NOT NULL
      GROUP BY skill_name ORDER BY percent_good ASC, total DESC LIMIT 10
  percent_good_by_agent:
    title: Percent good by agent (worst first)
    kind: bar
    sql: >-
      SELECT split_part(agent, ' ', 1) AS name, count(*) AS total,
      count(*) FILTER (WHERE score = 1) AS good,
      count(*) FILTER (WHERE score = 2) AS bad,
      round(100.0 * count(*) FILTER (WHERE score = 1) / count(*), 1) AS percent_good
      FROM feedback WHERE {filters} AND score IS NOT NULL
      GROUP BY name ORDER BY percent_good ASC, total DESC LIMIT 10
  percent_good_by_eval:
    title: Percent good by eval (worst first)
    kind: bar
    sql: >-
      SELECT COALESCE(eval_name, '(none)') AS name, count(*) AS total,
      count(*) FILTER (WHERE score = 1) AS good,
      count(*) FILTER (WHERE score = 2) AS bad,
      round(100.0 * count(*) FILTER (WHERE score = 1) / count(*), 1) AS percent_good
      FROM feedback WHERE {filters} AND score IS NOT NULL
      GROUP BY name ORDER BY percent_good ASC, total DESC LIMIT 10
  latest_comments:
    title: Latest comments
    kind: table
    sql: >-
      SELECT created_at, COALESCE(skill_name, session_id) AS name, agent, eval_name,
      CASE score WHEN 1 THEN 'good' WHEN 2 THEN 'bad' ELSE 'unrated' END AS rating, comment
      FROM feedback WHERE {filters} AND comment IS NOT NULL AND comment <> ''
      ORDER BY created_at DESC LIMIT 10
  # Core's summary of a trajectory (modules/write/summarize_trajectory.py), read from the
  # stored ATIF with the summary's type checks but not its range limits: a client posts
  # that ATIF, so a value counts only as the right JSON type - steps an array, a total a
  # number - and an odd row reads as unknown instead of failing the panel. An oversized
  # stub keeps no steps, so its count comes from final_metrics and its tool calls stay
  # unknown. Prompt and completion totals both 0 or missing mean the agent recorded no
  # usage, so every token column reads NULL, "not recorded", not "cost nothing";
  # otherwise a missing prompt or completion total reads 0.
  sessions_usage:
    sql: >-
      SELECT created_at, skill_name, agent, model,
      COALESCE(NULLIF(jsonb_array_length(step_list), 0), total_steps) AS steps,
      CASE WHEN jsonb_array_length(step_list) > 0 THEN
      (SELECT COALESCE(sum(jsonb_array_length(step->'tool_calls')), 0)
      FROM jsonb_array_elements(step_list) AS step
      WHERE jsonb_typeof(step->'tool_calls') = 'array') END AS tool_calls,
      CASE WHEN prompt <> 0 OR completion <> 0 THEN COALESCE(prompt, 0) END AS prompt_tokens,
      CASE WHEN prompt <> 0 OR completion <> 0 THEN cached END AS cached_tokens,
      CASE WHEN prompt <> 0 OR completion <> 0 THEN COALESCE(completion, 0) END
      AS completion_tokens,
      session_id
      FROM (SELECT t.created_at, t.skill_name, t.agent, f.eval_name, t.session_id,
      COALESCE(NULLIF(t.atif->'agent'->>'model_name', ''),
      NULLIF(split_part(t.agent, ' ', 2), '')) AS model,
      CASE WHEN jsonb_typeof(t.atif->'steps') = 'array' THEN t.atif->'steps' END AS step_list,
      CASE WHEN jsonb_typeof(t.atif->'final_metrics'->'total_steps') = 'number'
      THEN (t.atif->'final_metrics'->>'total_steps')::numeric END AS total_steps,
      CASE WHEN jsonb_typeof(t.atif->'final_metrics'->'total_prompt_tokens') = 'number'
      THEN (t.atif->'final_metrics'->>'total_prompt_tokens')::numeric END AS prompt,
      CASE WHEN jsonb_typeof(t.atif->'final_metrics'->'total_cached_tokens') = 'number'
      THEN (t.atif->'final_metrics'->>'total_cached_tokens')::numeric END AS cached,
      CASE WHEN jsonb_typeof(t.atif->'final_metrics'->'total_completion_tokens') = 'number'
      THEN (t.atif->'final_metrics'->>'total_completion_tokens')::numeric END AS completion
      FROM transcript t LEFT JOIN feedback f ON f.request_id = t.request_id) s
      WHERE {filters}
      ORDER BY created_at DESC LIMIT 10

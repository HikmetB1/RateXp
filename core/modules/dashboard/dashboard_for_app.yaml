# The app's Dashboard view: SQL over the feedback and transcript tables core writes
# (modules/write/schema/). The app image copies this file and dashboard_base.yaml out of
# core (see CONTRIBUTING.md).
#
# The app runs each sql with eight named parameters - type, skill, agent, eval, the three
# labels business_case, language and task_type, and since (an ISO timestamp) - and NULL
# means all. type is skill or session: a session rating is one that has no skill. {filters}
# in a panel's sql is where filters.sql goes, so the FROM of every panel exposes
# created_at, skill_name, agent, eval_name and the three labels: every panel reads
# feedback_with_labels, which adds each rating's conversation's labels. filters.values
# fill the dropdowns, each run with type alone so that picking a type narrows the others
# to the values that exist for it; download.sql is the "Download trajectories" button,
# with limit as a ninth parameter. A null skill, eval or label is shown and matched as
# "(none)", as on Dynatrace, so whole-session ratings, ratings without an eval and
# ratings without a labeled conversation can be picked.
name: RateXp
filters:
  sql: >-
    (%(type)s::text IS NULL
    OR CASE WHEN skill_name IS NULL THEN 'session' ELSE 'skill' END = %(type)s)
    AND (%(skill)s::text IS NULL OR COALESCE(skill_name, '(none)') = %(skill)s)
    AND (%(agent)s::text IS NULL OR split_part(agent, ' ', 1) = %(agent)s)
    AND (%(eval)s::text IS NULL OR COALESCE(eval_name, '(none)') = %(eval)s)
    AND (%(business_case)s::text IS NULL
    OR COALESCE(business_case, '(none)') = %(business_case)s)
    AND (%(language)s::text IS NULL OR COALESCE(language, '(none)') = %(language)s)
    AND (%(task_type)s::text IS NULL OR COALESCE(task_type, '(none)') = %(task_type)s)
    AND (%(since)s::timestamptz IS NULL OR created_at >= %(since)s)
  values:
    type: SELECT type FROM (VALUES ('skill'), ('session')) AS types (type)
    skill: >-
      SELECT DISTINCT COALESCE(skill_name, '(none)') AS skill FROM feedback
      WHERE %(type)s::text IS NULL
      OR CASE WHEN skill_name IS NULL THEN 'session' ELSE 'skill' END = %(type)s
      ORDER BY skill
    agent: >-
      SELECT DISTINCT split_part(agent, ' ', 1) AS agent FROM feedback
      WHERE %(type)s::text IS NULL
      OR CASE WHEN skill_name IS NULL THEN 'session' ELSE 'skill' END = %(type)s
      ORDER BY agent
    eval: >-
      SELECT DISTINCT COALESCE(eval_name, '(none)') AS eval FROM feedback
      WHERE %(type)s::text IS NULL
      OR CASE WHEN skill_name IS NULL THEN 'session' ELSE 'skill' END = %(type)s
      ORDER BY eval
    business_case: >-
      SELECT DISTINCT COALESCE(business_case, '(none)') AS business_case FROM transcript
      WHERE %(type)s::text IS NULL
      OR CASE WHEN skill_name IS NULL THEN 'session' ELSE 'skill' END = %(type)s
      ORDER BY business_case
    language: >-
      SELECT DISTINCT COALESCE(language, '(none)') AS language FROM transcript
      WHERE %(type)s::text IS NULL
      OR CASE WHEN skill_name IS NULL THEN 'session' ELSE 'skill' END = %(type)s
      ORDER BY language
    task_type: >-
      SELECT DISTINCT COALESCE(task_type, '(none)') AS task_type FROM transcript
      WHERE %(type)s::text IS NULL
      OR CASE WHEN skill_name IS NULL THEN 'session' ELSE 'skill' END = %(type)s
      ORDER BY task_type
download:
  sql: >-
    SELECT created_at, session_id, skill_name, agent, eval_name, score, comment, request_id,
    business_case, language, task_type
    FROM feedback_with_labels WHERE {filters}
    ORDER BY created_at DESC LIMIT %(limit)s
panels:
  total_ratings:
    title: Total ratings
    kind: number
    sql: SELECT count(*) AS value FROM feedback_with_labels WHERE {filters}
  percent_good:
    title: Percent good
    kind: number
    sql: >-
      SELECT round(100.0 * count(*) FILTER (WHERE score = 1) / NULLIF(count(*), 0), 1) AS value
      FROM feedback_with_labels WHERE {filters} AND score IS NOT NULL
  ratings_24h:
    title: Ratings in the last 24h
    kind: number
    sql: >-
      SELECT count(*) AS value FROM feedback_with_labels
      WHERE {filters} AND created_at >= now() - interval '24 hours'
  skills_rated:
    title: Skills rated
    kind: number
    sql: SELECT count(DISTINCT skill_name) AS value FROM feedback_with_labels WHERE {filters}
  good_bad_over_time:
    sql: >-
      SELECT date_trunc('day', created_at) AS day,
      count(*) FILTER (WHERE score = 1) AS good,
      count(*) FILTER (WHERE score = 2) AS bad
      FROM feedback_with_labels WHERE {filters}
      GROUP BY day ORDER BY day
  # The three bar panels list every row, worst first; the app scrolls them in their box.
  percent_good_by_skill:
    title: Percent good by skill (worst first)
    kind: bar
    sql: >-
      SELECT skill_name AS name, count(*) AS total,
      count(*) FILTER (WHERE score = 1) AS good,
      count(*) FILTER (WHERE score = 2) AS bad,
      round(100.0 * count(*) FILTER (WHERE score = 1) / count(*), 1) AS percent_good
      FROM feedback_with_labels WHERE {filters} AND score IS NOT NULL AND skill_name IS NOT NULL
      GROUP BY skill_name ORDER BY percent_good ASC, total DESC
  percent_good_by_agent:
    title: Percent good by agent (worst first)
    kind: bar
    sql: >-
      SELECT split_part(agent, ' ', 1) AS name, count(*) AS total,
      count(*) FILTER (WHERE score = 1) AS good,
      count(*) FILTER (WHERE score = 2) AS bad,
      round(100.0 * count(*) FILTER (WHERE score = 1) / count(*), 1) AS percent_good
      FROM feedback_with_labels WHERE {filters} AND score IS NOT NULL
      GROUP BY name ORDER BY percent_good ASC, total DESC
  percent_good_by_eval:
    title: Percent good by eval (worst first)
    kind: bar
    sql: >-
      SELECT COALESCE(eval_name, '(none)') AS name, count(*) AS total,
      count(*) FILTER (WHERE score = 1) AS good,
      count(*) FILTER (WHERE score = 2) AS bad,
      round(100.0 * count(*) FILTER (WHERE score = 1) / count(*), 1) AS percent_good
      FROM feedback_with_labels WHERE {filters} AND score IS NOT NULL
      GROUP BY name ORDER BY percent_good ASC, total DESC
  # The newest 10 ratings in the shape of the Query & table view's rows (GET /feedback),
  # each with its conversation's labels and the conversation itself (atif, NULL when none
  # was stored): the app draws them in that view's Feedback table.
  feedback:
    sql: >-
      SELECT created_at, session_id, skill_name, COALESCE(skill_name, session_id) AS name,
      agent, eval_name, score, comment, request_id, business_case, language, task_type, atif
      FROM (SELECT f.created_at, f.session_id, f.skill_name, f.agent, f.eval_name, f.score,
      f.comment, f.request_id, f.business_case, f.language, f.task_type, t.atif
      FROM feedback_with_labels f LEFT JOIN transcript t ON t.request_id = f.request_id) s
      WHERE {filters}
      ORDER BY created_at DESC LIMIT 10

name: ci

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uvx ruff check core/ app/ratexp/ seeder/ tests/ docs-server/
      - run: uvx ruff format --check core/ app/ratexp/ seeder/ tests/ docs-server/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Test core
        working-directory: core
        run: |
          uv sync --frozen --extra test --extra dynatrace-otlp
          uv run pytest -q
      - name: Test app
        working-directory: app/ratexp
        run: |
          uv sync --frozen --extra test
          uv run pytest -q
      - name: Test seeder
        working-directory: seeder
        run: |
          uv sync --frozen --extra test
          uv run pytest -q

  docs-server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - working-directory: docs-server
        run: |
          uv sync --frozen
          uv run mkdocs build --strict

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: Bring up the stack
        run: docker compose up --build -d
      - name: Wait for core + dashboard
        run: |
          for url in http://localhost:8000/healthz http://localhost:8001/healthz; do
            for i in $(seq 1 30); do
              curl -fsS "$url" && break
              sleep 2
            done
          done
      - name: Whole-app tests
        run: uv run --no-project --with-requirements tests/requirements.txt pytest tests/
      - name: Stack logs on failure
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - working-directory: app/ratexp/FE
        run: |
          npm ci
          npm run build

  dynatrace-app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - working-directory: app/dynatrace
        run: |
          npm ci
          npm test
          npm run lint
          npm run build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t ratexp-core --build-context repo=. ./core
      - run: docker build -t ratexp-app -f app/ratexp/Dockerfile --build-context dashboard=./core/modules/dashboard ./app/ratexp

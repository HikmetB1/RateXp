# Local RateXp stack. Mirrors the cloud topology (core + app + PostgreSQL) on
# your machine, using password auth instead of Entra ID.
#
#   docker compose up --build -d
#   open http://localhost:8001          # dashboard
#   http://localhost:8000/ratexp.sh     # the hook script skills download
#   http://localhost:8000/feedback      # where installed hooks post ratings
#   http://localhost:8000/transcript    # where they post consented transcripts
#
# Values default to a working local setup; to override one, put it in a root .env
# file, which compose reads automatically.
#
# Add the demo feedback seeder with the opt-in `seed` profile (costs API credits):
#   docker compose --profile seed up --build -d

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ratexp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ratexp}
      POSTGRES_DB: ${POSTGRES_DB:-ratexp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ratexp} -d ${POSTGRES_DB:-ratexp}"]
      interval: 3s
      timeout: 3s
      retries: 10

  core:
    build:
      context: ./core
    restart: unless-stopped
    # Core's own destination secrets live with core (cp core/.env.example core/.env).
    # Keep those keys out of `environment:` below - it wins over env_file, so
    # re-listing one here would blank out whatever core/.env sets.
    env_file:
      - path: ./core/.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ratexp:ratexp@db:5432/ratexp}
      RATEXP_DB_AUTH: password
      # Base URL baked into the hook script core serves at /ratexp.sh; installed
      # hooks post back here. Must be reachable from the host running the skill.
      # Stays here because it follows the port compose publishes.
      RATEXP_PUBLIC_URL: ${RATEXP_PUBLIC_URL:-http://localhost:${CORE_HOST_PORT:-8000}}
    # Live-reload the API on source edits; ratexp.sh is read per request.
    # --proxy-headers keeps parity with the deployed image (honors X-Forwarded-Proto).
    command: uvicorn api.serve_http:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips "*"
    volumes:
      - ./core:/app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${CORE_HOST_PORT:-8000}:8000"

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    # The dashboard's own read-source credentials live with app (cp app/.env.example
    # app/.env). Keep those keys out of `environment:` below - it wins over env_file, so
    # re-listing one here would blank out whatever app/.env sets.
    env_file:
      - path: ./app/.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ratexp:ratexp@db:5432/ratexp}
      RATEXP_DB_AUTH: password
      RATEXP_ENV: local
    depends_on:
      db:
        condition: service_healthy
      core:
        condition: service_started
    ports:
      - "${APP_HOST_PORT:-8001}:8000"

  # Opt-in demo seeder: a LangChain agent uses a bundled skill and submits feedback to
  # core, continuously. Only runs under the `seed` profile because it spends API credits.
  # Needs seeder/.env (cp from .env.example) with MODEL + matching key.
  seed:
    build: ./seeder
    profiles: ["seed"]
    restart: unless-stopped
    env_file:
      - path: ./seeder/.env
        required: false
    environment:
      RATEXP_CORE_URL: http://core:8000   # reach core over the compose network
    # Run the local loop, not the Azure Functions host, so no Azurite/storage is needed
    # locally. The deployed image still starts at function_app.py's timer trigger.
    working_dir: /home/site/wwwroot
    entrypoint: ["python3", "-m", "api.run_continuously"]
    depends_on:
      core:
        condition: service_started

volumes:
  pgdata:

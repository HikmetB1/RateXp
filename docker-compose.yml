# Local RateXp stack. Mirrors the cloud topology (core + app + PostgreSQL) on
# your machine, using password auth instead of Entra ID.
#
#   docker compose up --build -d
#   open http://localhost:8001          # dashboard
#   http://localhost:8000/ratexp.sh     # the hook script skills download
#   http://localhost:8000/feedback      # where installed hooks post ratings
#   http://localhost:8000/transcript    # where they post consented transcripts
#
# Values default to a working local setup; override via a .env file (see
# .env.example), which compose reads automatically.
#
# Add the demo feedback seeder with the opt-in `seed` profile (costs API credits):
#   docker compose --profile seed up --build -d

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ratexp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ratexp}
      POSTGRES_DB: ${POSTGRES_DB:-ratexp}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ratexp} -d ${POSTGRES_DB:-ratexp}"]
      interval: 3s
      timeout: 3s
      retries: 10

  core:
    build:
      context: ./core
      # Build extras into the image's venv. Set CORE_EXTRAS=dynatrace-otlp in .env
      # to run the OTLP destination adapters locally (Dynatrace, Bluebox);
      # empty = lean image.
      args:
        EXTRAS: ${CORE_EXTRAS:-}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ratexp:ratexp@db:5432/ratexp}
      RATEXP_DB_AUTH: password
      # Base URL baked into the hook script core serves at /ratexp.sh; installed
      # hooks post back here. Must be reachable from the host running the skill.
      RATEXP_PUBLIC_URL: ${RATEXP_PUBLIC_URL:-http://localhost:${CORE_HOST_PORT:-8000}}
      # Redaction's adapter deps aren't in the local core image, so keep it off
      # here; set true only when core is built with a redaction adapter.
      RATEXP_REDACTION_ENABLED: ${RATEXP_REDACTION_ENABLED:-false}
      # Destination adapter values (which adapters run is set in core/config.yaml).
      DT_TENANT_URL: ${DT_TENANT_URL:-}
      DT_ACCESS_TOKEN: ${DT_ACCESS_TOKEN:-}
      CUSTOM_PSQL_DSN: ${CUSTOM_PSQL_DSN:-}
      CUSTOM_DT_TENANT_URL: ${CUSTOM_DT_TENANT_URL:-}
      CUSTOM_DT_TOKEN: ${CUSTOM_DT_TOKEN:-}
      # Bluebox exports over OTLP, so it needs CORE_EXTRAS=dynatrace-otlp too.
      BLUEBOX_OTLP_ENDPOINT: ${BLUEBOX_OTLP_ENDPOINT:-}
      BLUEBOX_OTLP_TOKEN: ${BLUEBOX_OTLP_TOKEN:-}
    # Live-reload the API on source edits; scripts/ratexp.sh is read per request.
    # --proxy-headers keeps parity with the deployed image (honors X-Forwarded-Proto).
    command: uvicorn server:app --host 0.0.0.0 --port 8000 --reload --proxy-headers --forwarded-allow-ips "*"
    volumes:
      - ./core:/app
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${CORE_HOST_PORT:-8000}:8000"

  app:
    build:
      context: ./app
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://ratexp:ratexp@db:5432/ratexp}
      RATEXP_DB_AUTH: password
      RATEXP_ENV: local
      # Dashboard read source (config.yaml read_adapters - enable exactly one; default
      # app_be_psql). Override with RATEXP_READ_ADAPTER (app_be_psql | custom_psql |
      # app_be_dynatrace | custom_dynatrace) + the matching creds; the filter box then
      # speaks that source's language (SQL for psql, DQL for dynatrace).
      RATEXP_READ_ADAPTER: ${RATEXP_READ_ADAPTER:-}
      DT_QUERY_URL: ${DT_QUERY_URL:-}
      DT_ACCESS_TOKEN: ${DT_ACCESS_TOKEN:-}
      CUSTOM_PSQL_DSN: ${CUSTOM_PSQL_DSN:-}
      CUSTOM_DT_QUERY_URL: ${CUSTOM_DT_QUERY_URL:-}
      CUSTOM_DT_TOKEN: ${CUSTOM_DT_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy
      core:
        condition: service_started
    ports:
      - "${APP_HOST_PORT:-8001}:8000"

  # Opt-in demo seeder: a LangChain agent uses a bundled skill and submits feedback to
  # core, continuously. Only runs under the `seed` profile because it spends API credits.
  # Needs functions/skills-consumer/.env (cp from .env.example) with MODEL + matching key.
  seed:
    build: ./functions/skills-consumer
    profiles: ["seed"]
    restart: unless-stopped
    env_file:
      - path: ./functions/skills-consumer/.env
        required: false
    environment:
      RATEXP_CORE_URL: http://core:8000   # reach core over the compose network
    # Run the continuous local seeder (sched loop), not the Azure Functions host, so no
    # Azurite/storage is needed locally. The deployed image still runs the timer trigger.
    entrypoint: ["python3", "/home/site/wwwroot/seeder.py"]
    depends_on:
      core:
        condition: service_started

volumes:
  pgdata:

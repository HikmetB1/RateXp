# seeder runtime config. Every key is required - a missing key fails loudly at startup.
# Skills come from skills/*/SKILL.md; the model's key comes from .env.

# ATIF schema version stamped on every seeded trajectory (matches core's value).
schema_version: ATIF-v1.7

# Any init_chat_model id, e.g. azure_openai:<deployment>. Only the matching key goes
# in .env. Both of these take an env override so a deployment can point elsewhere
# without editing the file - Terraform sets both on the Function App.
model: openai:gpt-4o-mini          # env MODEL overrides
core_url: http://localhost:8000    # env RATEXP_CORE_URL overrides

temperature: 0.7
max_rounds: 40                     # agent turns per task before it must rate
critical_ratio: 0.3                # share of runs that take the tough-reviewer stance below
                                   # (0 = always lenient, 1 = always tough); keeps some bad ratings flowing
oversized_ratio: 0.2               # share of runs whose trajectory is bloated past core's
                                   # max_transcript_bytes, so core stores a meta-only stub
                                   # instead of the full steps (0 = never, 1 = always)

# Gap between runs for the local loop, `python -m api.run_continuously`. The deployed
# Azure timer ignores this and takes its cadence from the SEED_SCHEDULE app setting
# instead (NCRONTAB with seconds, e.g. "*/30 * * * * *" = every 30s), which Terraform
# sets from its seed_schedule variable.
interval_seconds: 3

# {name} = the skill for this call, {max_rounds} = turn budget.
system_prompt: |
  You are a developer's coding agent. You have one skill, "{name}", via the load_skill
  tool, and a scratch workspace with list_files, read_file, and write_file to actually
  do the work. Load the skill, then carry out the task for real — create and edit the
  files it calls for, one step at a time, reading things back as a careful developer
  would, over as many turns as it needs (up to {max_rounds}). Don't shortcut straight to
  the verdict. But you MUST always finish the same way: once the work is done (or if the
  task turns out small or ambiguous), assess the skill itself — how well it guided you —
  and answer with an honest score (1 = good, 2 = bad) plus a short, specific comment.
  Never end your turn without that assessment.

task_prompt: |
  Use the "{name}" skill on a small, realistic task that fits it. Load it with load_skill,
  then actually do the work in your workspace — write the real files the skill produces
  and check them, taking as many steps as the task needs (up to {max_rounds}). Then judge
  the skill itself and finish with your assessment: an honest score (1 = good, 2 = bad)
  and a short comment naming what made it that way. Don't stop before you have rated it.

# Appended to the task on a `critical_ratio` share of runs so the seeder isn't all praise.
critical_prompt: |
  For this run, review the skill as a tough, demanding user who does not give it the
  benefit of the doubt. Hold it to a high bar: if anything is unclear, incomplete, clunky,
  out of date, or makes you work harder than it should, that is a real flaw — give it a
  bad score (2) and a short, specific comment naming exactly what fell short. Only rate it
  good (1) if it genuinely left nothing to complain about. Stay honest — don't invent
  problems — but don't soften or round up a mediocre experience into a good rating.

# app (dashboard) settings. Every key is required; see ./README.md (## Config) for what each one does.

schema_version: ATIF-v1.7

list_view_limit: 10
list_max_limit: 1000
top_skills_limit: 10

query_enabled: true
query_timeout_ms: 5000
query_max_rows: 1000

ws_enabled: true
ws_broadcast_interval_ms: 2000

# Exactly one source may be enabled. Secrets live in the env vars named below.
read_adapters:
  app_be_psql:
    enabled: true
  custom_psql:
    enabled: false
    dsn_env: CUSTOM_PSQL_DSN
  app_be_dynatrace:
    enabled: false
    query_url_env: DT_QUERY_URL
    token_env: DT_ACCESS_TOKEN
  custom_dynatrace:
    enabled: false
    query_url_env: CUSTOM_DT_QUERY_URL
    token_env: CUSTOM_DT_TOKEN

[project]
name = "ratexp-app"
version = "1.0.0"
description = "RateXp dashboard: read-only API over stored feedback, plus the dashboard UI."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pyyaml>=6.0",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
]

[project.optional-dependencies]
# Microsoft Entra ID database auth (cloud). Always built in, so RATEXP_DB_AUTH can
# pick password or entra without a matching rebuild.
entra = ["azure-identity>=1.16"]
test = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["load_config"]

# api/ and modules/ carry no __init__.py, so discovery has to be told to treat
# them as namespace packages - without `namespaces` it finds nothing and the
# install silently ships only load_config.
[tool.setuptools.packages.find]
include = ["api*", "modules*"]
namespaces = true

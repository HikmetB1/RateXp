# docs-server settings; see ./README.md (## Config: every key in mkdocs.yml).

site_name: RateXp docs
site_url: https://ratexp-core.azurewebsites.net/guide/   # must end in /guide/
docs_dir: theme
dev_addr: 127.0.0.1:8002
hooks:
  - include_shared_sections.py   # before add_repo_pages.py, which rewrites the shared links
  - add_repo_pages.py
  - outline_page_sections.py
  - list_page_sections_in_nav.py
  - tab_code_blocks.py

nav:
  - Home: README.md
  - Guides:
      - Overview: docs/README.md
      - Human evals: docs/human-evals.md
      - Read the feedback: docs/read-the-feedback.md
      - Config and env: docs/config-and-env.md
      - Custom deploy: docs/custom-deploy.md
  - Components:
      - core: core/README.md
      - app:
          - Overview: app/README.md
          - ratexp: app/ratexp/README.md
          - dynatrace: app/dynatrace/README.md
      - seeder: seeder/README.md
  - Contributing: CONTRIBUTING.md
  - Legal:
      - License: https://github.com/HikmetB1/RateXp/blob/main/LICENSE
      - Terms of Service: TERMS.md
      - Contributor License Agreement: CLA.md
      - Third-party notices: THIRD_PARTY_NOTICES.md
      - Skill attribution: seeder/skills/ATTRIBUTION.md

theme:
  name: material
  logo: app/ratexp/FE/public/logo-white.png
  favicon: app/ratexp/FE/public/favicon.ico
  font:
    text: Nunito
    code: JetBrains Mono
  palette:
    - scheme: default   # Sunburst
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to Midnight
    - scheme: slate     # Midnight
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to Sunburst
  features:
    - search.highlight
    - search.suggest
    - content.code.copy
    - navigation.sections
    - navigation.expand
    - navigation.footer
    - navigation.top
    - toc.follow
  icon:
    admonition:
      tip: material/lightbulb-outline
      note: material/information-outline

extra:
  generator: false
  nest_sections:   # pages shown as a group of their ## sections
    README.md: Intro          # name of the link to the top of the page
    docs/human-evals.md:      # empty: no link to the top
    docs/read-the-feedback.md:

extra_css:
  - ratexp.css

markdown_extensions:
  - toc:
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - mdx_truly_sane_lists:
      nested_indent: 2
  - mdx_breakless_lists
  - github-callouts
  - pymdownx.highlight:
      auto_title: true
      pygments_lang_class: true
      auto_title_map:
        Bash: Terminal
        Text Only: Text
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

validation:
  unrecognized_links: warn
  anchors: warn
